[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arousal-bat"
version = "1.0.0"
description = "Multimodal physiological arousal decoding in a boundary-avoidance task"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anirudh Natarajan", email = "amn2225@columbia.edu" },
    { name = "Paul Sajda" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "captum>=0.7",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbconvert"]

[tool.setuptools]
packages = ["arousal"]
